frontend:
  replicaCount: 1

  image:
    repository: devsecops-frontend
    tag: "4.0"
    pullPolicy: IfNotPresent

  service:
    type: NodePort
    port: 80
    targetPort: 80
    nodePort: 30080

backend:
  replicaCount: 1
  image:
    repository: devsecops-backend
    tag: "1.0"
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 8080
    targetPort: 8080

postgres:
  replicaCount: 1
  image:
    repository: postgres
    tag: "17"
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 5432
    targetPort: 5432
